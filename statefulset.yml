---
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: mysql 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-database
  template:
    metadata:
      labels: 
        app: app-database
    spec:
      containers:
        - name: dbcontainer
          image: amruthkumar123/k8sfirst:dbimage
          ports: 
            - containerPort: 3306
          
          envFrom:
          - secretMapRef: 
             name: bankapp-db-secret

          resources:
            requests: 
              cpu: "100m"
              memory: "128Mi"
            limits: 
              cpu: "200"
              memory: "256Mi"

          volumeMounts:
            - name: pvc-1 
              mountPath: /var/lib/mysql


      volumeClaimTemplates:
       - metadata: 
            name: pvc-1
         spec: 
           accessModes:
            - ReadWriteOnce
           resource:
            requests: 
              storage: 2Gi 