apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: mysql 
spec:
  serviceName: mysqldb
  replicas: 1
  selector:
    matchLabels:
      app: app-database
  template:
    metadata:
      labels: 
        app: app-database
    spec:
      containers:
      - name: dbcontainer
        image: amruthkumar123/k8sfirst:dbimage
        ports: 
        - containerPort: 3306

        envFrom:
        - secretRef:        # ✅ corrected from secretMapRef
            name: bankapp-db-secret

        resources:
          requests: 
            cpu: "100m"
            memory: "128Mi"
          limits: 
            cpu: "200m"     # ✅ added "m" unit
            memory: "256Mi"

        volumeMounts:
        - name: mysql-pvc   # ✅ must match claim name
          mountPath: /usr/share/nginx/html/

  volumeClaimTemplates:
  - metadata: 
      name: mysql-pvc      # ✅ matches volumeMounts name
    spec: 
      accessModes:
      - ReadWriteOnce
      resources:           # ✅ corrected from resource
        requests: 
          storage: 2Gi
      
